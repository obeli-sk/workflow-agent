# nginx reverse proxy for the exe.dev LLM integration endpoint, so a workflow
# agent running OUTSIDE exe.dev can use https://llm.int.exe.xyz through an ssh
# tunnel. Run this ON an attached exe.dev VM; it listens with PLAIN HTTP on
# localhost (the tunnel encrypts the client leg) and speaks the real TLS to the
# endpoint with certificate verification, fixing the Host header the endpoint
# routes on.

# Usage:
#   vm$   mkdir -p /tmp/exe-llm-proxy/{logs,tmp/body}
#         # if the distro's nginx needs its spool dirs (Debian/Ubuntu do):
#         sudo mkdir -p /var/lib/nginx/{body,fastcgi,proxy,uwsgi,scgi}
#   vm$   nginx -c $(pwd)/examples/exe-llm-proxy.conf
#   you$  ssh -L 7070:127.0.0.1:7071 <yourinstance>.exe.xyz
#   you$  export LLM_BASE_URL=http://localhost:7070   # plain http, no custom CA
#
# The endpoint is keyless: exe.dev authenticates the VM at the network edge, so
# LLM_API_KEY stays unset.
daemon off;
pid /tmp/exe-llm-proxy/nginx.pid;
error_log /tmp/exe-llm-proxy/logs/error.log warn;
events { worker_connections 64; }
http {
    access_log off;
    client_body_temp_path /tmp/exe-llm-proxy/tmp/body;
    server {
        listen 127.0.0.1:7071;
        location / {
            proxy_pass https://llm.int.exe.xyz;
            proxy_http_version 1.1;
            proxy_set_header Host llm.int.exe.xyz;
            proxy_set_header Connection "";
            proxy_ssl_server_name on;   # SNI = llm.int.exe.xyz
            proxy_ssl_name llm.int.exe.xyz;
            proxy_buffering off;        # stream SSE deltas through untouched
            proxy_read_timeout 300s;    # long completions / slow models
            proxy_send_timeout 300s;
        }
    }
}
