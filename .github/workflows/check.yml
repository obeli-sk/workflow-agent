name: check
permissions:
  contents: read

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      ref:
        description: "The ref (branch or SHA) to process"
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash -xe {0}

jobs:
  check-dev-deps:
    name: Check dev-deps.txt
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          ref: ${{ github.event.inputs.ref }} # Use the ref if provided, otherwise defaults to the current branch/commit

      - uses: nixbuild/nix-quick-install-action@v34
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          nix_conf: |
            extra-substituters = https://obeli-sk.cachix.org
            extra-trusted-public-keys = obeli-sk.cachix.org-1:31iM9GWSEhAXvvuTWQ7CvAcwvgRzsuJ9yJghywSd3Jw=

      - name: Populate the nix store
        run: nix develop --command echo

      - name: Regenerate dev-deps.txt
        run: nix develop --command ./scripts/dev-deps.sh

      - name: Check dev-deps.txt
        run: |
          cat dev-deps.txt
          if ! git diff --quiet -- dev-deps.txt; then
              echo "dev-deps.txt is stale, run ./scripts/dev-deps.sh:"
              git diff -- dev-deps.txt
              exit 1
          fi

  check-wit-deps:
    name: Check generated wit/deps
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          ref: ${{ github.event.inputs.ref }} # Use the ref if provided, otherwise defaults to the current branch/commit

      - uses: nixbuild/nix-quick-install-action@v34
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          nix_conf: |
            extra-substituters = https://obeli-sk.cachix.org
            extra-trusted-public-keys = obeli-sk.cachix.org-1:31iM9GWSEhAXvvuTWQ7CvAcwvgRzsuJ9yJghywSd3Jw=

      - name: Populate the nix store
        run: nix develop --command echo

      - name: Regenerate wit/deps
        run: nix develop --command ./scripts/generate-wit-deps.sh

      - name: Check wit/deps
        run: |
          if ! git diff --quiet -- workflow/workflow-rs/wit/deps; then
              echo "workflow/workflow-rs/wit/deps is stale, run ./scripts/generate-wit-deps.sh:"
              git diff -- workflow/workflow-rs/wit/deps
              exit 1
          fi

  rust:
    name: Rust workflow
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          ref: ${{ github.event.inputs.ref }} # Use the ref if provided, otherwise defaults to the current branch/commit

      - uses: nixbuild/nix-quick-install-action@v34
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          nix_conf: |
            extra-substituters = https://obeli-sk.cachix.org
            extra-trusted-public-keys = obeli-sk.cachix.org-1:31iM9GWSEhAXvvuTWQ7CvAcwvgRzsuJ9yJghywSd3Jw=

      - name: Populate the nix store
        run: nix develop --command echo

      - name: Format
        run: nix develop --command cargo fmt --all --check

      - name: Clippy
        run: nix develop --command cargo clippy --workspace --all-targets -- -D warnings

      - name: Unit tests (just-bash-rs)
        run: nix develop --command just test-rs

  js:
    name: JS workflow backend
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          ref: ${{ github.event.inputs.ref }} # Use the ref if provided, otherwise defaults to the current branch/commit

      - uses: nixbuild/nix-quick-install-action@v34
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          nix_conf: |
            extra-substituters = https://obeli-sk.cachix.org
            extra-trusted-public-keys = obeli-sk.cachix.org-1:31iM9GWSEhAXvvuTWQ7CvAcwvgRzsuJ9yJghywSd3Jw=

      - name: Populate the nix store
        run: nix develop --command echo

      - name: Unit tests (webhook/activity/shared/vendor/just-bash/workflow-js)
        run: nix develop --command just test-js

  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          ref: ${{ github.event.inputs.ref }} # Use the ref if provided, otherwise defaults to the current branch/commit

      - uses: nixbuild/nix-quick-install-action@v34
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          nix_conf: |
            extra-substituters = https://obeli-sk.cachix.org
            extra-trusted-public-keys = obeli-sk.cachix.org-1:31iM9GWSEhAXvvuTWQ7CvAcwvgRzsuJ9yJghywSd3Jw=

      - name: Populate the nix store
        run: nix develop --command echo

      # deployment.rs.toml's [[workflow_wasm]] points at the release artifact, so
      # build it before verifying.
      - name: Build the workflow component
        run: nix develop --command just build

      - name: deployment.rs.toml/deployment.js.toml parity
        run: nix develop --command ./scripts/check-deployment-toml-parity.sh

      - name: obelisk deployment verify (rs)
        run: nix develop --command obelisk deployment verify -d deployment.rs.toml -s server.toml --allow-unavailable-runtime-config

      - name: obelisk deployment verify (js)
        run: nix develop --command obelisk deployment verify -d deployment.js.toml -s server.toml --allow-unavailable-runtime-config

  e2e-common:
    name: End-to-end tests (backend-agnostic)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          ref: ${{ github.event.inputs.ref }} # Use the ref if provided, otherwise defaults to the current branch/commit

      - uses: nixbuild/nix-quick-install-action@v34
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          nix_conf: |
            extra-substituters = https://obeli-sk.cachix.org
            extra-trusted-public-keys = obeli-sk.cachix.org-1:31iM9GWSEhAXvvuTWQ7CvAcwvgRzsuJ9yJghywSd3Jw=

      - name: Populate the nix store
        run: nix develop --command echo

      - name: bash workflow e2e
        run: nix develop --command ./scripts/test-e2e-bash-workflow.sh
        env:
          GITHUB_TOKEN: ""
          MCP_SERVER_TOKEN: ""

  e2e:
    name: End-to-end tests (${{ matrix.backend }} backend)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        backend: [rs, js]
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          ref: ${{ github.event.inputs.ref }} # Use the ref if provided, otherwise defaults to the current branch/commit

      - uses: nixbuild/nix-quick-install-action@v34
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          nix_conf: |
            extra-substituters = https://obeli-sk.cachix.org
            extra-trusted-public-keys = obeli-sk.cachix.org-1:31iM9GWSEhAXvvuTWQ7CvAcwvgRzsuJ9yJghywSd3Jw=

      - name: Populate the nix store
        run: nix develop --command echo

      - name: agent workflow e2e
        run: nix develop --command ./scripts/test-e2e-agent-workflow.sh ${{ matrix.backend }}
        env:
          GITHUB_TOKEN: ""
          MCP_SERVER_TOKEN: ""

      - name: chat e2e
        run: nix develop --command ./scripts/test-e2e-chat.sh ${{ matrix.backend }}
        env:
          GITHUB_TOKEN: ""
          MCP_SERVER_TOKEN: ""

      - name: interrupt e2e
        run: nix develop --command ./scripts/test-e2e-interrupt.sh ${{ matrix.backend }}
        env:
          GITHUB_TOKEN: ""
          MCP_SERVER_TOKEN: ""

      - name: mcp e2e
        run: nix develop --command ./scripts/test-e2e-mcp.sh ${{ matrix.backend }}
        env:
          GITHUB_TOKEN: ""

      - name: redeploy e2e
        run: nix develop --command ./scripts/test-e2e-redeploy.sh ${{ matrix.backend }}
        env:
          GITHUB_TOKEN: ""
          MCP_SERVER_TOKEN: ""

  # Expected-red pending an Obelisk-side fix (see the script's header comment
  # and docs/js-backend-migration.md): kept running, non-blocking, so it
  # starts passing (and this job can lose its continue-on-error) automatically
  # once Obelisk's JS workflow runtime gains typed join-next-child tracking.
  e2e-replay-parity:
    name: End-to-end replay parity (rs <-> js)
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          ref: ${{ github.event.inputs.ref }} # Use the ref if provided, otherwise defaults to the current branch/commit

      - uses: nixbuild/nix-quick-install-action@v34
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          nix_conf: |
            extra-substituters = https://obeli-sk.cachix.org
            extra-trusted-public-keys = obeli-sk.cachix.org-1:31iM9GWSEhAXvvuTWQ7CvAcwvgRzsuJ9yJghywSd3Jw=

      - name: Populate the nix store
        run: nix develop --command echo

      - name: replay-parity e2e
        run: nix develop --command ./scripts/test-e2e-replay-parity.sh
        env:
          GITHUB_TOKEN: ""
          MCP_SERVER_TOKEN: ""
