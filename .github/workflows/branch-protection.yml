name: branch-protection

# The branch-protection API needs a token with repo admin rights, which the
# built-in GITHUB_TOKEN can never have (there is no "administration" scope
# for it, unlike contents/pull-requests/etc.), so GH_TOKEN_ADMIN is used
# below instead of secrets.GITHUB_TOKEN.
permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "flake.nix"
      - "scripts/sync-branch-protection.sh"
  schedule:
    # Weekly safety net that re-applies protection even if nothing in the
    # paths above changed, correcting any manual drift from the GitHub UI.
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash -xe {0}

jobs:
  sync-branch-protection:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0

      - uses: nixbuild/nix-quick-install-action@v34
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          nix_conf: |
            extra-substituters = https://obeli-sk.cachix.org
            extra-trusted-public-keys = obeli-sk.cachix.org-1:31iM9GWSEhAXvvuTWQ7CvAcwvgRzsuJ9yJghywSd3Jw=

      - name: Populate the nix store
        run: nix develop --command echo

      - name: Sync branch protection for main
        run: nix develop --command ./scripts/sync-branch-protection.sh main
        env:
          # Needs a PAT (fine-grained "Administration: write" on this repo,
          # or classic `repo` scope); the default GITHUB_TOKEN can't manage
          # branch protection.
          GH_TOKEN: ${{ secrets.GH_TOKEN_ADMIN }}
