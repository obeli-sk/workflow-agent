wit = "wit"
exec.lock_expiry.minutes = 10
max_retries = 0
location = "packs/obelisk-control/tools/call-target.js"
env_vars = [{ key = "TARGET_OBELISK_API_URL", value = "${TARGET_OBELISK_API_URL:-http://127.0.0.1:5005}" }]
[[activity_js.allowed_host]]
pattern = "${TARGET_OBELISK_API_URL:-http://127.0.0.1:5005}"
methods = ["GET", "POST"]
request_url_regex = "^(GET|POST) ${TARGET_OBELISK_API_URL_REGEX:-http://127\\.0\\.0\\.1:5005}/v1/executions"
secrets = ["TARGET_OBELISK_TOKEN"]
