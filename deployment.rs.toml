# --- System-prompt descriptor -------------------------------------------------
# The obelisk-control use case (control this Obelisk instance). The generic
# session loop prepends this prompt to its shared bash guidance. Swap this FFQN
# (workflow.run-cancellable descriptor-ffqn) to host a different use case. The
# tools-json result field is unused compatibility data and remains empty.

[[activity_js]]
name = "pack_describe"
ffqn = "obelisk-control:agent/pack.describe"
params = []
return_type = "result<record { prompt: string, tools-json: string, warnings: list<string> }, string>"
location = "packs/obelisk-control/descriptor.js"
exec.lock_expiry.seconds = 30
# The descriptor fetches the docs indexes listed in DOCS_URLS_JSON (see the
# curl-program block below) once at session start and inlines them into the
# system prompt; failed or oversized fetches degrade to placeholders plus a
# `warnings` list the workflow surfaces to the user in the UI.
env_vars = [
  { key = "DOCS_URLS_JSON", value = "${DOCS_URLS_JSON:-[\"https://obeli.sk/docs/${OBELISK_VERSION:-latest}/llms.txt/\"]}" },
]
[[activity_js.allowed_host]]
pattern = "https://obeli.sk"
methods = ["GET"]

# --- Shell programs ----------------------------------------------------------
# Programs are Obelisk-backed just-bash commands (contract
# `func(stdin, args) -> result<record { stdout, stderr, exit-code }>`). The
# workflow learns which to wire up from the session config activity below, so
# adding a program means editing this manifest alone (no workflow
# rebuild): add its activity block here and append `{ name, ffqn, description }`
# to the config activity's PROGRAMS_JSON. The workflow registers a shell
# command per entry and lists it (with its description) in the system prompt.

# Session configuration is read once at session start. MAX_STEPS defaults to 20;
# the program and MCP registries default to the deployed entries below. Override
# any of them from the host environment without rebuilding the workflow.
[[activity_js]]
name = "config_discover"
ffqn = "obelisk-agent:config/config.discover"
wit = "wit"
location = "activity/config-discover.js"
env_vars = [
  { key = "MAX_STEPS", value = "${MAX_STEPS:-20}" },
  { key = "PROGRAMS_JSON", value = '''
${PROGRAMS_JSON:-[
  {"name":"curl","ffqn":"obelisk-agent:programs/program.curl","description":"GET-only HTTP client"},
  {"name":"chat","ffqn":"obelisk-agent:programs/program.chat","description":"discover, read, message, and create peer agent sessions on this instance"}
]}
''' },
  { key = "MCP_SERVERS_JSON", value = '${MCP_SERVERS_JSON:-[{"name":"obelisk-local","ffqn":"obelisk-agent:mcp/server.obelisk-local"}]}' },
  # Each entry mounts a lazily-listed GitHub repo tree at /workspace/apps/<name>
  # (obelisk_web/obelisk-web.js -> the mount_apps activity below). `owner`
  # defaults to "obeli-sk" and `ref` to "main" when omitted; `description` is
  # a terse "Lang: phrase" surfaced verbatim as a bullet in the system
  # prompt (session.rs's render_app_help / session-logic.js's renderAppHelp) -
  # keep it short, the repo's own README.md is the place for detail. The
  # default list is curated for authoring value: JS repos are directly
  # copy-and-adapt, Rust ones only make the cut when they publish reusable
  # OCI components or demonstrate a pattern worth rewriting to JS - no
  # Go/Python-only material. Override the whole list to mount a different
  # set of repos, private forks, or pinned refs.
  { key = "APPS_JSON", value = '''
${APPS_JSON:-[
  {"name":"components","repo":"components","description":"Rust: reusable OCI activities for HTTP, GitHub, Fly.io, Docker, OpenAI, and browser automation; copy a `*-oci.toml` block straight into a deployment.toml instead of writing the activity from scratch"},
  {"name":"agent-backed-llm-server","repo":"agent-backed-llm-server","description":"JS: an OpenAI-compatible LLM endpoint backed by a Claude/Codex CLI subscription; copy the webhook+activity pair when bridging a similar CLI tool"},
  {"name":"demo-stargazers","repo":"demo-stargazers","description":"Rust: a full webhook -> workflow -> external-API pattern (GitHub star notifications with persistent side effects); a reference before writing a similar workflow in JS"},
  {"name":"demo-tutorial","repo":"demo-tutorial","description":"JS: a small serial/parallel durable workflow tutorial; the fastest way to see the obelisk.* host API used correctly"},
  {"name":"obelisk-version-monitor","repo":"obelisk-version-monitor","description":"JS: a complete dashboard app (webhook + workflow + UI); reference it when building another operator-facing dashboard"},
  {"name":"workflow-agent","repo":"workflow-agent","description":"Rust + JS: this agent's own source (session loop, just-bash interpreter, activity/pack examples); the reference for extending or debugging yourself"}
]}
''' },
  { key = "TARGET_OBELISK_WEBHOOK_URL", value = "${TARGET_OBELISK_WEBHOOK_URL:-http://127.0.0.1:9290}" },
]
exec.lock_expiry.seconds = 30

# --- Docs: rendered llms.txt over the curl program ----------------------------
# The session reads the Obelisk docs through the GET-only curl program instead
# of a GitHub contents mount. Two pieces:
#
#   * OBELISK_VERSION pins the doc set to the target runtime's version (e.g.
#     "v0.41.3", matching the site's versioned doc directories). Empty falls
#     back to `latest`. Set it from the flake lock when pinning matters
#     (https://obeli.sk/docs/${OBELISK_VERSION}/llms.txt/).
#   * DOCS_URLS_JSON lists llms.txt-style indexes; the descriptor inlines their
#     URLs into the system prompt at session start and the model fetches them
#     (and any detail page they reference) through the curl program.
#
# The curl program's obeli.sk allowlist (below) covers both the index and every
# page URL it references.
[[activity_js]]
name = "program_curl"
ffqn = "obelisk-agent:programs/program.curl"
params = [
  { name = "stdin", type = "string" },
  { name = "args",  type = "list<string>" },
]
return_type = "result<record { stdout: string, stderr: string, exit-code: u32 }, string>"
location = "activity/curl.js"
exec.lock_expiry.seconds = 30
# Docs (llms.txt index + every page URL it references) and obeli.sk release
# notes; the prompt points the model at the same hosts' indexes.
[[activity_js.allowed_host]]
pattern = "https://obeli.sk"
methods = ["GET"]
# The target's webhook listener, so the shell can smoke-test deployed webhook
# endpoints directly; the same URL is printed by `mount`.
[[activity_js.allowed_host]]
pattern = "${TARGET_OBELISK_WEBHOOK_URL:-http://127.0.0.1:9290}"
methods = ["GET"]

# Peer sessions: discover, inspect, message, and create other workflow-agent
# sessions on THIS instance (OBELISK_API_URL, not the target one).
[[activity_js]]
name = "program_chat"
ffqn = "obelisk-agent:programs/program.chat"
params = [
  { name = "stdin", type = "string" },
  { name = "args",  type = "list<string>" },
]
return_type = "result<record { stdout: string, stderr: string, exit-code: u32 }, string>"
location = "activity/chat.js"
# create POSTs new executions; a retry after an ambiguous failure would
# double-submit. (The session loop also intercepts create/rename/current.)
max_retries = 0
exec.lock_expiry.seconds = 30
env_vars = [
  { key = "OBELISK_API_URL", value = "${OBELISK_API_URL:-http://127.0.0.1:5005}" },
  "AGENT_MODELS",
]
[[activity_js.allowed_host]]
pattern = "${OBELISK_API_URL:-http://127.0.0.1:5005}"
methods = ["GET", "PUT", "POST"]
request_url_regex = "^GET ${OBELISK_API_URL_REGEX:-http://127\\.0\\.0\\.1:5005}/v1/executions|PUT ${OBELISK_API_URL_REGEX:-http://127\\.0\\.0\\.1:5005}/v1/executions/E_[^/]+/stub$|POST ${OBELISK_API_URL_REGEX:-http://127\\.0\\.0\\.1:5005}/v1/executions$"
secrets = ["OBELISK__API__TOKEN"]
replace_in = ["headers"]

# Native call: run any deployed Obelisk function chosen at runtime by the model
# (obelisk-control pack). A workflow, so obelisk.call runs durably in-loop.
[[workflow_js]]
ffqn = "obelisk-control:tools/native.call"
params = [
  { name = "ffqn",        type = "string" },
  { name = "params-json", type = "string" },
]
return_type = "result<string, string>"
location = "packs/obelisk-control/native-call.js"

# --- Reference mounts: GitHub repo trees ---------------------------------------
# One activity backs every lazily-listed VFS repo tree the session mounts to
# browse example apps while authoring deployments (APPS_JSON above picks which
# repos and where; owner/repo/ref travel in params-json, not fixed env vars, so
# this single block serves them all). GH_OWNER scopes the allowed_host
# boundary to one GitHub org/user; GITHUB_TOKEN is optional but raises the
# GitHub API rate limit from the shared 60 req/h anonymous IP pool to 5000 req/h,
# which matters once multiple sessions share an egress IP. The workflow calls
# (method, params-json) on first `ls`/`cat` under each mount.
[[activity_js]]
name = "mount_apps"
ffqn = "obelisk-agent:mounts/apps.request"
params = [
  { name = "method",      type = "string" },
  { name = "params-json", type = "string" },
]
return_type = "result<string, string>"
location = "activity/github-contents.js"
exec.lock_expiry.seconds = 30
[[activity_js.allowed_host]]
pattern = "https://api.github.com"
methods = ["GET"]
request_url_regex = "^GET https://api\\.github\\.com/repos/${GH_OWNER:-obeli-sk}/[^/]+/(contents|commits/)"
secrets = ["GITHUB_TOKEN"]
replace_in = ["headers"]

# --- LLM endpoint: multi-provider client --------------------------------------
# The only way the agent talks to a model. It speaks a provider-neutral message
# model and routes each request to the correct wire API (anthropic-messages,
# openai-chat-completions, openai-responses) based on the AGENT_MODELS catalog.
#
# AGENT_MODELS is a JSON array of models: each entry has
#   { id, label, api_type, path?, wire_model, max_tokens? }
# It is REQUIRED (no built-in default): set it in the environment before serving
# (see .envrc-example / models.*.json). The endpoint origin is shared across the
# catalog via LLM_BASE_URL, and a single LLM_API_KEY secret authenticates it; the
# per-model `path` is only the provider prefix appended to that origin.

[[activity_js]]
name = "llm_chat"
ffqn = "obelisk-agent:llm/chat.completion"
wit = "wit"
location = "activity/llm-chat.js"
exec.lock_expiry.minutes = 10
max_retries = 3
env_vars = [
  "AGENT_MODELS",
  { key = "LLM_BASE_URL", value = "${LLM_BASE_URL:-http://127.0.0.1:9190}" },
]
[[activity_js.allowed_host]]
pattern = "${LLM_BASE_URL:-http://127.0.0.1:9190}"
methods = ["POST"]
request_url_regex = "^POST http[s]?://[^/]+(/[^/]+)*/v1/(messages|chat/completions|responses)$"
secrets = ["LLM_API_KEY"]
replace_in = ["headers"]

