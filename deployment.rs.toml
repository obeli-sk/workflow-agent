name = "session_injection"
ffqn = "obelisk-agent:stub/stub.injection"
wit = "wit"

[[activity_stub]]
name = "session_record_output"
ffqn = "obelisk-agent:stub/stub.record-output"
wit = "wit"

# Renames publish on their own join set through this dedicated stub, so
# consumers fetch a session's current name with one bounded request instead of
# scanning the mixed session-events stream.
[[activity_stub]]
name = "session_renamed"
ffqn = "obelisk-agent:stub/stub.session-renamed"
wit = "wit"

# Per-script interrupt offer: the workflow submits one child per running bash
# script and announces its id via shell-started events; writing it stops that
# script (exit 130) without touching the session itself.
[[activity_stub]]
name = "session_interrupt"
ffqn = "obelisk-agent:stub/stub.interrupt"
wit = "wit"

# --- Workflow (implementation-specific; see scripts/check-deployment-toml-parity.sh) ---
# Native Rust workflow (workflow/workflow-rs). The public run-cancellable
# export resolves the descriptor and runs the session loop in one execution.
# Params and the return type come from the WIT, not this file.
#
# This is the Rust variant of the session workflow: it exports the canonical
# `obelisk-agent:workflow/workflow.run-cancellable` FFQN backed by the native
# component. `deployment.js.toml` is the JS variant: same FFQN, backed by
# `workflow/workflow-js` instead. Only one of the two is ever the active
# deployment at a time (see docs/js-backend-migration.md); everything outside
# this workflow block must stay identical between the two files, enforced by
# `scripts/check-deployment-toml-parity.sh`.

[[workflow_wasm]]
name = "workflow_agent_rs"
location = "target/wasm32-unknown-unknown/release/workflow_agent_rs.wasm"
exec.lock_expiry.seconds = 30

# Backtrace source map for the native workflow. All these `.rs` files compile
# into the single workflow_agent_rs.wasm, so every key is the full
# deployment-relative path: suffix matching returns None on ambiguity, and a
# bare `.../src/lib.rs` would collide between workflow-rs and just-bash-rs. The
# build-generated `out/any.rs` glue (wit-bindgen) is intentionally omitted: it
# lives under target/ with a per-build hash in its path, so it has no stable
# deployment-owned source to point at.
[workflow_wasm.backtrace.sources]
# Hand-written workflow sources (workflow/workflow-rs).
".../workflow/workflow-rs/src/lib.rs" = "workflow/workflow-rs/src/lib.rs"
".../workflow/workflow-rs/src/agent.rs" = "workflow/workflow-rs/src/agent.rs"
