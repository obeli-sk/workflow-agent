methods = ["GET"]
request_url_regex = '^GET ${OBELISK_API_URL_REGEX:-http://127\.0\.0\.1:5005}/v1/deployments'
secrets = ["OBELISK__API__TOKEN"]
replace_in = ["headers"]

[[outbound_http.allowed_host]]
pattern = "${OBELISK_API_URL:-http://127.0.0.1:5005}"
