[database.sqlite]
directory = "sqlite"

[limits]
# Deployment calls carry the manifest and source attachments, exceeding the 1 MiB default for this app.
max_persisted_value_size_bytes = 2097152

[log.file]
enabled = true
level = "info,obeli=debug,app=debug"
style = "plain"                           # One of "plain","plain_compact","json"
span = "none"                             # One of "none","new","enter","exit","close","active","full"
target = false
rotation = "daily"                        # One of "minutely"|"hourly"|"daily"|"never"
directory = "."
prefix = "obelisk_server_daily.log"
