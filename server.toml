[[outbound_http.allowed_host]]
pattern = "https://obeli.sk"
methods = ["GET"]

[secrets]
LLM_API_KEY = { env = "LLM_API_KEY" }
OBELISK__API__TOKEN = { env = "OBELISK__API__TOKEN" }
# The target Obelisk the agent deploys to/controls; defaults to the agent's own
# token for the self-host case (see .envrc-example, README recursion warning).
TARGET_OBELISK_TOKEN = { env = "TARGET_OBELISK_TOKEN" }
# Set to empty value for the testing mcp server
MCP_SERVER_TOKEN = { env = "MCP_SERVER_TOKEN" }

# Agent's own instance: webhook UI reads of the agent's own sessions plus the
# pause/unpause/cancel/stub control of them.
[[outbound_http.allowed_host]]
pattern = "${OBELISK_API_URL:-http://127.0.0.1:5005}"
methods = ["GET", "POST", "PUT"]
secrets = ["OBELISK__API__TOKEN"]
replace_in = ["headers"]

# Target instance: the control/deploy tools and the VFS deployment mount.
[[outbound_http.allowed_host]]
pattern = "${TARGET_OBELISK_API_URL:-http://127.0.0.1:5005}"
methods = ["GET", "POST", "PUT"]
secrets = ["TARGET_OBELISK_TOKEN"]
replace_in = ["headers"]

# Target instance webhooks: lets the shell's GET-only curl smoke-test deployed
# webhook endpoints directly; the same URL is printed by `mount`.
[[outbound_http.allowed_host]]
pattern = "${TARGET_OBELISK_WEBHOOK_URL:-http://127.0.0.1:9290}"
methods = ["GET"]

[[outbound_http.allowed_host]]
pattern = "${LLM_BASE_URL:-http://127.0.0.1:9190}"
methods = ["POST"]
request_url_regex = "^POST http[s]?://[^/]+(/[^/]+)*/v1/(messages|chat/completions|responses)$"
secrets = ["LLM_API_KEY"]
replace_in = ["headers"]

# --- MCP servers (stateless) --------------------------------------------------
# One outbound-host grant per MCP server, paired with its deployment.toml
# activity block (see docs/mcp.md). For an authenticated server, name the secret
# MCP_SERVER_TOKEN (the fixed placeholder activity/mcp.js reads) and source it
# from any host env var. Omit the secret entirely for a keyless server.
#
#
[[outbound_http.allowed_host]]
pattern = "${MCP_OBELISK_LOCAL_URL:-http://127.0.0.1:1071}"
methods = ["POST"]
secrets = ["MCP_SERVER_TOKEN"]
replace_in = ["headers"]
