app_name = "workflow-agent"

[cloud.integrations]
llm = { type = "llm", env = "LLM_BASE_URL" }

[secrets]
LLM_API_KEY = { optional = true }
# The agent's own Obelisk server, accessed e.g. by the UI to get execution state.
OBELISK_API_TOKEN = { type = "internal" }
# Optional: raises the GitHub API rate limit for the /workspace/components
# mount from the shared 60 req/h anonymous IP pool to 5000 req/h. Leave it unset
# for occasional use.
GITHUB_MOUNT_TOKEN = { optional = true }
# Optional: ObeliskNet token enabling `obelisk cloud` in the shell.
OBELISK_CLOUD_API_TOKEN = { optional = true }

[public_env]
DOCS_URLS_JSON = { optional = true }
OBELISK_VERSION = { optional = true }
MAX_STEPS = { optional = true }
PROGRAMS_JSON = { optional = true }
APPS_JSON = { optional = true }
OBELISK_API_URL = { type = "internal", source = "api-url" }
AGENT_MODELS = { optional = true }
GITHUB_API_URL = { optional = true }
LLM_BASE_URL = {}
OBELISK_UI_URL = { type = "internal", source = "webui-url" }
OBELISK_CLOUD_API_URL = { optional = true }
OBELISK_CLOUD_APPS_DOMAIN = { optional = true }

# Allow reading documentation
[[outbound_http.allowed_host]]
pattern = "https://obeli.sk"
methods = ["GET"]

# Agent's own instance. These mirror the components' declarations in
# deployment.toml one-for-one rather than being consolidated into one
# broader grant; both this and the component's url_regex_suffix apply to
# every request.

# program_chat: peer session discovery/create + stub fulfilment.
[[outbound_http.allowed_host]]
url_prefix = "${OBELISK_API_URL}"
methods = ["GET"]
url_regex_suffix = "/v1/executions"
secrets = ["OBELISK_API_TOKEN"]
replace_in = ["headers"]
[[outbound_http.allowed_host]]
url_prefix = "${OBELISK_API_URL}"
methods = ["PUT"]
url_regex_suffix = "/v1/executions/E_[^/]+/stub$"
secrets = ["OBELISK_API_TOKEN"]
replace_in = ["headers"]
[[outbound_http.allowed_host]]
url_prefix = "${OBELISK_API_URL}"
methods = ["POST"]
url_regex_suffix = "/v1/executions$"
secrets = ["OBELISK_API_TOKEN"]
replace_in = ["headers"]

# llm_chat: history reconstruction from prior LLM executions.
[[outbound_http.allowed_host]]
url_prefix = "${OBELISK_API_URL}"
methods = ["POST"]
url_regex_suffix = "/v1/executions/events/batch$"
secrets = ["OBELISK_API_TOKEN"]
replace_in = ["headers"]

# tool_pause_execution
[[outbound_http.allowed_host]]
url_prefix = "${OBELISK_API_URL}"
methods = ["PUT"]
url_regex_suffix = "/v1/executions/E_[^/]+/pause$"
secrets = ["OBELISK_API_TOKEN"]
replace_in = ["headers"]
[[outbound_http.allowed_host]]
url_prefix = "${OBELISK_API_URL}"
methods = ["GET"]
url_regex_suffix = "/v1/executions/E_[^/]+/status$"
secrets = ["OBELISK_API_TOKEN"]
replace_in = ["headers"]

# tool_unpause_execution
[[outbound_http.allowed_host]]
url_prefix = "${OBELISK_API_URL}"
methods = ["PUT"]
url_regex_suffix = "/v1/executions/E_[^/]+/unpause$"
secrets = ["OBELISK_API_TOKEN"]
replace_in = ["headers"]
[[outbound_http.allowed_host]]
url_prefix = "${OBELISK_API_URL}"
methods = ["GET"]
url_regex_suffix = "/v1/executions/E_[^/]+/status$"
secrets = ["OBELISK_API_TOKEN"]
replace_in = ["headers"]

# tool_cancel_execution
[[outbound_http.allowed_host]]
url_prefix = "${OBELISK_API_URL}"
methods = ["PUT"]
url_regex_suffix = "/v1/executions/E_[^/]+/cancel$"
secrets = ["OBELISK_API_TOKEN"]
replace_in = ["headers"]
[[outbound_http.allowed_host]]
url_prefix = "${OBELISK_API_URL}"
methods = ["GET"]
url_regex_suffix = "/v1/executions/E_[^/]+/status$"
secrets = ["OBELISK_API_TOKEN"]
replace_in = ["headers"]

# tool_stub_execution
[[outbound_http.allowed_host]]
url_prefix = "${OBELISK_API_URL}"
methods = ["PUT"]
url_regex_suffix = "/v1/executions/E_[^/]+/stub$"
secrets = ["OBELISK_API_TOKEN"]
replace_in = ["headers"]
[[outbound_http.allowed_host]]
url_prefix = "${OBELISK_API_URL}"
methods = ["GET"]
url_regex_suffix = "/v1/executions/E_[^/]+/status$"
secrets = ["OBELISK_API_TOKEN"]
replace_in = ["headers"]

# ui-api webhook: read-only polling (statuses, responses, events, logs,
# deployments, files) run as direct fetches instead of one child activity
# per call.
[[outbound_http.allowed_host]]
url_prefix = "${OBELISK_API_URL}"
methods = ["GET"]
url_regex_suffix = "/v1/executions|/v1/deployments|/v1/deployment-id|/v1/files/"
secrets = ["OBELISK_API_TOKEN"]
replace_in = ["headers"]

# ObeliskNet provisioner and app APIs (cloud_run, cloud_prepare_deploy, cloud_finish_deploy, cloud_tenant).
[[outbound_http.allowed_host]]
url_prefix = "${OBELISK_CLOUD_API_URL:-http://127.0.0.1:9090}"
methods = ["GET", "POST", "PUT", "DELETE"]
secrets = [{ name = "OBELISK_CLOUD_API_TOKEN", optional = true }]
replace_in = ["headers"]

[[outbound_http.allowed_host]]
pattern = "https://*.${OBELISK_CLOUD_APPS_DOMAIN:-obelisk.works}"
methods = ["GET", "POST", "PUT", "DELETE"]
secrets = [{ name = "OBELISK_CLOUD_API_TOKEN", optional = true }]
replace_in = ["headers"]

# Hosted app webhooks use the public HTTPS listener.
[[outbound_http.allowed_host]]
pattern = "https://*.${OBELISK_CLOUD_APPS_DOMAIN:-obelisk.works}"
methods = ["GET"]

# GitHub repository reads for mount points.
[[outbound_http.allowed_host]]
url_prefix = "${GITHUB_API_URL:-https://api.github.com}/repos/"
methods = ["GET"]
secrets = ["GITHUB_MOUNT_TOKEN"]
replace_in = ["headers"]

# LLM server
[[outbound_http.allowed_host]]
url_prefix = "${LLM_BASE_URL}"
methods = ["GET"]
url_regex_suffix = "(/[^/]+)*/v1/models$"
secrets = ["LLM_API_KEY"]
replace_in = ["headers"]
[[outbound_http.allowed_host]]
url_prefix = "${LLM_BASE_URL}"
methods = ["POST"]
url_regex_suffix = "(/[^/]+)*/v1/(messages|chat/completions|responses)$"
secrets = ["LLM_API_KEY"]
replace_in = ["headers"]
