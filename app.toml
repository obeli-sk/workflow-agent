app_name = "workflow-agent"

[secrets]
LLM_API_KEY = { optional = true }
# The target Obelisk the agent deploys to/controls. Stays env-backed because it
# usually authenticates against a different server (see README, Target instance).
TARGET_OBELISK_TOKEN = {}
# The agent's own Obelisk server, accessed e.g. by the UI to get execution state.
OBELISK_API_TOKEN = { type = "internal" }
# Leave unset for a keyless MCP server (e.g. the testing one).
MCP_SERVER_TOKEN = { optional = true }
# Optional: raises the GitHub API rate limit for the /workspace/components
# mount from the shared 60 req/h anonymous IP pool to 5000 req/h. Leave it unset
# for occasional use.
GITHUB_MOUNT_TOKEN = { optional = true }
# Optional: ObeliskNet token enabling `obelisk cloud` in the shell.
OBELISK_CLOUD_API_TOKEN = { optional = true }

[public_env]
DOCS_URLS_JSON = { optional = true }
OBELISK_VERSION = { optional = true }
MAX_STEPS = { optional = true }
PROGRAMS_JSON = { optional = true }
MCP_SERVERS_JSON = { optional = true }
APPS_JSON = { optional = true }
TARGET_OBELISK_WEBHOOK_URL = { optional = true }
OBELISK_API_URL = { type = "internal", source = "api-url" }
AGENT_MODELS = { optional = true }
GITHUB_MOUNT_OWNER = { optional = true }
GITHUB_API_URL = { optional = true }
LLM_BASE_URL = { optional = true }
LLM_API_PREFIX = { optional = true }
TARGET_OBELISK_API_URL = { optional = true }
MCP_OBELISK_LOCAL_URL = { optional = true }
OBELISK_UI_URL = { type = "internal", source = "webui-url" }
OBELISK_CLOUD_API_URL = { optional = true }
OBELISK_CLOUD_APP_API_PATTERN = { optional = true }

# Allow reading documentation
[[outbound_http.allowed_host]]
pattern = "https://obeli.sk"
methods = ["GET"]

# Agent's own instance. These mirror the components' declarations in
# deployment.{js,rs}.toml one-for-one rather than being consolidated into one
# broader grant; both this and the component's request_url_regex apply to
# every request.

# program_chat: peer session discovery/create + stub fulfilment.
[[outbound_http.allowed_host]]
pattern = "${OBELISK_API_URL}"
methods = ["GET", "PUT", "POST"]
request_url_regex = "^GET https?://[^/]+/v1/executions|PUT https?://[^/]+/v1/executions/E_[^/]+/stub$|POST https?://[^/]+/v1/executions$"
secrets = ["OBELISK_API_TOKEN"]
replace_in = ["headers"]

# llm_chat: history reconstruction from prior LLM executions.
[[outbound_http.allowed_host]]
pattern = "${OBELISK_API_URL}"
methods = ["POST"]
request_url_regex = "^POST https?://[^/]+/v1/executions/events/batch$"
secrets = ["OBELISK_API_TOKEN"]
replace_in = ["headers"]

# tool_pause_execution
[[outbound_http.allowed_host]]
pattern = "${OBELISK_API_URL}"
methods = ["GET", "PUT"]
request_url_regex = "^(PUT https?://[^/]+/v1/executions/E_[^/]+/pause|GET https?://[^/]+/v1/executions/E_[^/]+/status)$"
secrets = ["OBELISK_API_TOKEN"]
replace_in = ["headers"]

# tool_unpause_execution
[[outbound_http.allowed_host]]
pattern = "${OBELISK_API_URL}"
methods = ["GET", "PUT"]
request_url_regex = "^(PUT https?://[^/]+/v1/executions/E_[^/]+/unpause|GET https?://[^/]+/v1/executions/E_[^/]+/status)$"
secrets = ["OBELISK_API_TOKEN"]
replace_in = ["headers"]

# tool_cancel_execution
[[outbound_http.allowed_host]]
pattern = "${OBELISK_API_URL}"
methods = ["GET", "PUT"]
request_url_regex = "^(PUT https?://[^/]+/v1/executions/E_[^/]+/cancel|GET https?://[^/]+/v1/executions/E_[^/]+/status)$"
secrets = ["OBELISK_API_TOKEN"]
replace_in = ["headers"]

# tool_stub_execution
[[outbound_http.allowed_host]]
pattern = "${OBELISK_API_URL}"
methods = ["GET", "PUT"]
request_url_regex = "^(PUT https?://[^/]+/v1/executions/E_[^/]+/stub|GET https?://[^/]+/v1/executions/E_[^/]+/status)$"
secrets = ["OBELISK_API_TOKEN"]
replace_in = ["headers"]

# ui-api webhook: read-only polling (statuses, responses, events, logs,
# deployments, files) run as direct fetches instead of one child activity
# per call.
[[outbound_http.allowed_host]]
pattern = "${OBELISK_API_URL}"
methods = ["GET"]
request_url_regex = "^GET https?://[^/]+(/v1/executions|/v1/deployments|/v1/deployment-id|/v1/files/)"
secrets = ["OBELISK_API_TOKEN"]
replace_in = ["headers"]

# Target instance: the control/deploy tools and the VFS deployment mount.
[[outbound_http.allowed_host]]
pattern = "${TARGET_OBELISK_API_URL:-http://127.0.0.1:5005}"
methods = ["GET", "POST", "PUT"]
secrets = ["TARGET_OBELISK_TOKEN"]
replace_in = ["headers"]

# ObeliskNet provisioner and app APIs (cloud_run, cloud_prepare_deploy, cloud_tenant).
[[outbound_http.allowed_host]]
pattern = "${OBELISK_CLOUD_API_URL:-http://127.0.0.1:9090}"
methods = ["GET", "POST", "PUT", "DELETE"]
secrets = [{ name = "OBELISK_CLOUD_API_TOKEN", optional = true }]
replace_in = ["headers"]

[[outbound_http.allowed_host]]
pattern = "${OBELISK_CLOUD_APP_API_PATTERN:-https://*.obelisk.works:5005}"
methods = ["GET", "POST", "PUT"]
secrets = [{ name = "OBELISK_CLOUD_API_TOKEN", optional = true }]
replace_in = ["headers"]

# Target instance webhooks
[[outbound_http.allowed_host]]
pattern = "${TARGET_OBELISK_WEBHOOK_URL:-http://127.0.0.1:9290}"
methods = ["GET"]

# GitHub contents API for mount points. Read only PAT for public repos is enough.
[[outbound_http.allowed_host]]
pattern = "${GITHUB_API_URL:-https://api.github.com}"
methods = ["GET"]
secrets = ["GITHUB_MOUNT_TOKEN"]
replace_in = ["headers"]

# LLM server
[[outbound_http.allowed_host]]
pattern = "${LLM_BASE_URL:-http://127.0.0.1:9190}"
methods = ["GET", "POST"]
request_url_regex = "^GET http[s]?://[^/]+(/[^/]+)*/v1/models$|^POST http[s]?://[^/]+(/[^/]+)*/v1/(messages|chat/completions|responses)$"
secrets = ["LLM_API_KEY"]
replace_in = ["headers"]

# MCP servers
[[outbound_http.allowed_host]]
pattern = "${MCP_OBELISK_LOCAL_URL:-http://127.0.0.1:1071}"
methods = ["POST"]
secrets = ["MCP_SERVER_TOKEN"]
replace_in = ["headers"]
