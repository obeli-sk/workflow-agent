# --- Deployment editing: checkout -> edit one component -> submit -------------
# The workflow holds the checked-out deployment.toml in memory, split into
# per-component blocks, and edits one component at a time (see
# workflow/agent-loop.js). These activities are the durable I/O boundary: fetch
# the manifest, read owned file blobs from the CAS, and submit the manifest as a
# new inactive deployment (digests filled, CAS-efficient preflight + multipart
# retry). A hot redeploy goes through tool_apply_deployment.

[[activity_js]]
name = "tool_deployment_checkout"
ffqn = "obelisk-agent:tools/webapi.deployment-checkout"
params = [
  { name = "deployment-id", type = "option<string>" },
]
return_type = "result<record { deployment-id: string, active-deployment-id: string, deployment-toml: string, files: list<record { path: string, digest: string, size: u64 }> }, string>"
location = "packs/obelisk-control/tools/deployment-checkout.js"
env_vars = [{ key = "OBELISK_API_URL", value = "${OBELISK_API_URL:-http://127.0.0.1:5005}" }]
[[activity_js.allowed_host]]
pattern = "${OBELISK_API_URL:-http://127.0.0.1:5005}"
methods = ["GET"]
request_url_regex = "^GET ${OBELISK_API_URL_REGEX:-http://127\\.0\\.0\\.1:5005}(/v1/deployment-id|/v1/deployments/)"
secrets = ["OBELISK__API__TOKEN"]
replace_in = ["headers"]

[[activity_js]]
name = "tool_deployment_read_blob"
ffqn = "obelisk-agent:tools/webapi.deployment-read-blob"
params = [
  { name = "digest", type = "string" },
]
return_type = "result<string, string>"
location = "packs/obelisk-control/tools/deployment-read-blob.js"
env_vars = [{ key = "OBELISK_API_URL", value = "${OBELISK_API_URL:-http://127.0.0.1:5005}" }]
[[activity_js.allowed_host]]
pattern = "${OBELISK_API_URL:-http://127.0.0.1:5005}"
methods = ["GET"]
request_url_regex = "^GET ${OBELISK_API_URL_REGEX:-http://127\\.0\\.0\\.1:5005}/v1/files/"
secrets = ["OBELISK__API__TOKEN"]
replace_in = ["headers"]

[[activity_js]]
name = "tool_deployment_submit"
ffqn = "obelisk-agent:tools/webapi.deployment-submit"
params = [
  { name = "deployment-toml",              type = "string" },
  { name = "edited-files",                 type = "list<record { path: string, content: string }>" },
  { name = "description",                   type = "string" },
  { name = "allow-missing-runtime-config", type = "bool" },
  { name = "deployment-id",                type = "string" },
]
return_type = "result<record { deployment-id: string, deployment-toml: string }, string>"
# Submit verifies the whole deployment (compile + link every component) before
# persisting, which far exceeds the 1s default lock.
exec.lock_expiry.minutes = 5
max_retries = 0
location = "packs/obelisk-control/tools/deployment-submit.js"
env_vars = [{ key = "OBELISK_API_URL", value = "${OBELISK_API_URL:-http://127.0.0.1:5005}" }]
[[activity_js.allowed_host]]
pattern = "${OBELISK_API_URL:-http://127.0.0.1:5005}"
methods = ["POST"]
request_url_regex = "^POST ${OBELISK_API_URL_REGEX:-http://127\\.0\\.0\\.1:5005}/v1/deployments$"
secrets = ["OBELISK__API__TOKEN"]
replace_in = ["headers"]

[[activity_js]]
name = "tool_deployment_switch"
ffqn = "obelisk-agent:tools/webapi.deployment-switch"
params = [
  { name = "deployment-id",                type = "string" },
