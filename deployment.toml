secrets = ["TARGET_OBELISK_TOKEN"]
replace_in = ["headers"]

[[activity_js]]
name = "tool_deployment_switch"
ffqn = "obelisk-agent:tools/webapi.deployment-switch"
wit = "wit"
# A cold switch re-verifies (compile + link) before enqueuing.
exec.lock_expiry.minutes = 5
location = "packs/obelisk-control/tools/deployment-switch.js"
