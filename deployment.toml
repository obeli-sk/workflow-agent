env_vars = [{ key = "OBELISK_API_URL", value = "${OBELISK_API_URL:-http://127.0.0.1:5005}" }]
[[activity_js.allowed_host]]
pattern = "${OBELISK_API_URL:-http://127.0.0.1:5005}"
methods = ["GET", "PUT"]
request_url_regex = "^(PUT ${OBELISK_API_URL_REGEX:-http://127\\.0\\.0\\.1:5005}/v1/executions/E_[^/]+/stub|GET ${OBELISK_API_URL_REGEX:-http://127\\.0\\.0\\.1:5005}/v1/executions/E_[^/]+/status)$"
secrets = ["OBELISK__API__TOKEN"]
replace_in = ["headers"]

# --- Stub activity: human-in-the-loop -----------------------------------------

[[activity_stub]]
name = "tool_ask_user"
ffqn = "obelisk-agent:tools/input.ask-user"
params = [
  { name = "question", type = "string" },
]
return_type = "result<string, string>"

# confirm-apply: the human gate before a hot reload goes live. The workflow
# parks on this stub when the agent calls obelisk.deployment_push with
# mode="apply"; the web UI surfaces it as an OK/Cancel card (with a source diff
# vs the active deployment). ok => approved (apply proceeds), err => cancelled.
[[activity_stub]]
name = "tool_confirm_apply"
ffqn = "obelisk-agent:tools/deploy.confirm-apply"
params = [
  { name = "deployment-id", type = "string" },
  { name = "summary",       type = "string" },
]
return_type = "result<_, string>"

# One generic operator-message offer owned by the session loop. The UI may
# fulfil it only while this concrete stub execution is pending. The workflow
# appends it as the next user message and immediately opens another offer.
[[activity_stub]]
name = "session_injection"
ffqn = "obelisk-agent:agent/session.injection"
params = []
return_type = "result<variant { prompt(record { id: string, text: string }), shell(record { id: string, script: string, stdin: string }) }, string>"

[[activity_stub]]
name = "session_record_output"
ffqn = "obelisk-agent:agent/session.record-output"
params = [
  { name = "event-id", type = "string" },
]
return_type = """result<
  variant {
    agent-error(record { id: string, text: string, turn-index: u64 }),
    tool-result(record { id: string, output: variant { ok(record { stdout: string, stderr: string, exit-code: s32 }), error(string) } }),
    shell-output(record { id: string, script: string, result: record { stdout: string, stderr: string, exit-code: s32 } }) },
  string
>"""

# --- Workflow -----------------------------------------------------------------
# Native Rust workflow (workflow/workflow-rs). The public run-cancellable
# export resolves the descriptor and runs the session loop in one execution.
# Params and the return type come from the WIT, not this file.

[[workflow_wasm]]
name = "workflow_agent_rs"
location = "target/wasm32-unknown-unknown/release/workflow_agent_rs.wasm"
exec.lock_expiry.seconds = 30

# Backtrace source map for the native workflow. All these `.rs` files compile
# into the single workflow_agent_rs.wasm, so every key is the full
# deployment-relative path: suffix matching returns None on ambiguity, and a
# bare `.../src/lib.rs` would collide between workflow-rs and just-bash-rs. The
# build-generated `out/any.rs` glue (wit-bindgen) is intentionally omitted: it
# lives under target/ with a per-build hash in its path, so it has no stable
# deployment-owned source to point at.
[workflow_wasm.backtrace.sources]
# Hand-written workflow sources (workflow/workflow-rs).
".../workflow/workflow-rs/src/lib.rs" = "workflow/workflow-rs/src/lib.rs"
".../workflow/workflow-rs/src/agent.rs" = "workflow/workflow-rs/src/agent.rs"
