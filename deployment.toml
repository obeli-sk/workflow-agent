# --- Deployment editing: checkout -> edit one component -> submit -------------
# The workflow holds the checked-out deployment.toml in memory, split into
# per-component blocks, and edits one component at a time (see
# workflow/agent-loop.js). These activities are the durable I/O boundary: fetch
# the manifest, read owned file blobs from the CAS, and submit the manifest as a
# new inactive deployment (digests filled, CAS-efficient preflight + multipart
# retry). A hot redeploy goes through tool_apply_deployment.

[[activity_js]]
name = "tool_deployment_checkout"
ffqn = "obelisk-agent:tools/webapi.deployment-checkout"
wit = "wit"
location = "packs/obelisk-control/tools/deployment-checkout.js"
env_vars = [{ key = "TARGET_OBELISK_API_URL", value = "${TARGET_OBELISK_API_URL:-http://127.0.0.1:5005}" }]
[[activity_js.allowed_host]]
pattern = "${TARGET_OBELISK_API_URL:-http://127.0.0.1:5005}"
methods = ["GET"]
request_url_regex = "^GET ${TARGET_OBELISK_API_URL_REGEX:-http://127\\.0\\.0\\.1:5005}/v1/deployments/"
secrets = ["TARGET_OBELISK_TOKEN"]
replace_in = ["headers"]

[[activity_js]]
