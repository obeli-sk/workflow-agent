secrets = ["TARGET_OBELISK_TOKEN"]
replace_in = ["headers"]

[[activity_js]]
name = "tool_deployment_submit"
ffqn = "obelisk-agent:tools/webapi.deployment-submit"
wit = "wit"
# Submit verifies the whole deployment (compile + link every component) before
# persisting, which far exceeds the 1s default lock.
exec.lock_expiry.minutes = 5
max_retries = 0
location = "packs/obelisk-control/tools/deployment-submit.js"
env_vars = [{ key = "TARGET_OBELISK_API_URL", value = "${TARGET_OBELISK_API_URL:-http://127.0.0.1:5005}" }]
[[activity_js.allowed_host]]
pattern = "${TARGET_OBELISK_API_URL:-http://127.0.0.1:5005}"
methods = ["POST"]
