# --- GitHub export ----------------------------------------------
# Activities for pushing the live deployment manifest + owned sources into a
# GitHub repo. Each is invoked by workflow.push-deployment; the commit chain is
# driven from the workflow (one file per commit) so each step is durable and
# replayable. Secret WORKFLOW_AGENT_GITHUB_TOKEN is exposed as an outbound HTTP
# secret and replaced only in approved GitHub request headers.

[[activity_js]]
name = "github_create_branch"
ffqn = "agent-herder:github/repo.create-branch"
params = [
  { name = "owner",       type = "string" },
  { name = "repo",        type = "string" },
  { name = "base-branch", type = "string" },
  { name = "new-branch",  type = "string" },
]
return_type = "result<string, string>"
location = "packs/obelisk-control/github/create-branch.js"
exec.lock_expiry.seconds = 30
[[activity_js.allowed_host]]
pattern = "https://api.github.com"
methods = ["GET", "POST"]
request_url_regex = "^(POST https://api\\.github\\.com/repos/[^/]+/[^/]+/git/refs|GET https://api\\.github\\.com/repos/[^/]+/[^/]+/git/ref/heads/[^/]+)$"
secrets = ["WORKFLOW_AGENT_GITHUB_TOKEN"]
replace_in = ["headers"]


[[activity_js]]
name = "github_push_file"
ffqn = "agent-herder:github/repo.push-file"
params = [
  { name = "owner",             type = "string" },
  { name = "repo",              type = "string" },
  { name = "branch",            type = "string" },
  { name = "expected-head-oid", type = "string" },
  { name = "path",              type = "string" },
  { name = "content",           type = "string" },
  { name = "headline",          type = "string" },
  { name = "body",              type = "string" },
]
return_type = "result<string, string>"
location = "packs/obelisk-control/github/push-file.js"
exec.lock_expiry.seconds = 60
max_retries = 0
[[activity_js.allowed_host]]
pattern = "https://api.github.com"
methods = ["POST"]
request_url_regex = "^POST https://api\\.github\\.com/graphql$"
secrets = ["WORKFLOW_AGENT_GITHUB_TOKEN"]
replace_in = ["headers"]


[[activity_js]]
name = "github_create_pr"
ffqn = "agent-herder:github/repo.create-pr"
params = [
  { name = "owner",        type = "string" },
  { name = "repo",         type = "string" },
  { name = "head-branch",  type = "string" },
  { name = "base-branch",  type = "string" },
  { name = "title",        type = "string" },
  { name = "body",         type = "string" },
]
return_type = "result<string, string>"
location = "packs/obelisk-control/github/create-pr.js"
exec.lock_expiry.seconds = 60
[[activity_js.allowed_host]]
pattern = "https://api.github.com"
methods = ["GET", "POST"]
request_url_regex = "^(GET|POST) https://api\\.github\\.com/repos/[^/]+/[^/]+/pulls$"
secrets = ["WORKFLOW_AGENT_GITHUB_TOKEN"]
replace_in = ["headers"]

[[workflow_js]]
ffqn = "agent-herder:export/workflow.push-deployment"
params = [
  { name = "branch-name", type = "string" },
  { name = "pr-title",    type = "string" },
  { name = "pr-body",     type = "string" },
]
return_type = "result<string, string>"
location = "packs/obelisk-control/push-deployment.js"


[[webhook_endpoint_js]]
name = "ui-api"
location = "webhook/ui-api.js"
routes = [
  { methods = ["GET"], route = "/" },
  { methods = ["GET"], route = "/api/models" },
  { methods = ["GET"], route = "/api/runs" },
  { methods = ["GET"], route = "/api/runs/:execution-id" },
  { methods = ["GET"], route = "/api/logs/:execution-id" },
  { methods = ["POST"], route = "/api/submit" },
  { methods = ["POST"], route = "/api/sessions" },
  { methods = ["POST"], route = "/api/answer/:child-id" },
  { methods = ["POST"], route = "/api/confirm/:child-id" },
  { methods = ["POST"], route = "/api/pause/:execution-id" },
  { methods = ["POST"], route = "/api/unpause/:execution-id" },
  { methods = ["POST"], route = "/api/cancel/:execution-id" },
  { methods = ["POST"], route = "/api/say/:execution-id" },
  { methods = ["POST"], route = "/api/shell/:execution-id" },
]
env_vars = [
  { key = "OBELISK_UI_URL",  value = "${OBELISK_UI_URL:-http://127.0.0.1:8080}" },
  { key = "OBELISK_API_URL", value = "${OBELISK_API_URL:-http://127.0.0.1:5005}" },
  "AGENT_MODELS",
]
# Read-only API access for the polling UI (statuses, responses, events, logs,
# deployments, files). These run as direct fetches from the webhook instead of
# one child activity per call.
[[webhook_endpoint_js.allowed_host]]
pattern = "${OBELISK_API_URL:-http://127.0.0.1:5005}"
methods = ["GET"]
request_url_regex = "^GET ${OBELISK_API_URL_REGEX:-http://127\\.0\\.0\\.1:5005}(/v1/executions|/v1/deployments|/v1/deployment-id|/v1/files/)"
secrets = ["OBELISK__API__TOKEN"]
replace_in = ["headers"]


[[activity_js]]
name = "tool_apply_deployment"
ffqn = "obelisk-agent:tools/webapi.apply-deployment"
params = [
  { name = "deployment-id", type = "string" },
]
return_type = "result<string, string>"
# A hot redeploy re-verifies (compile + link) before swapping executors.
exec.lock_expiry.minutes = 5
location = "packs/obelisk-control/tools/apply-deployment.js"
env_vars = [{ key = "OBELISK_API_URL", value = "${OBELISK_API_URL:-http://127.0.0.1:5005}" }]
[[activity_js.allowed_host]]
pattern = "${OBELISK_API_URL:-http://127.0.0.1:5005}"
methods = ["PUT"]
request_url_regex = "^PUT ${OBELISK_API_URL_REGEX:-http://127\\.0\\.0\\.1:5005}/v1/deployments/Dep_[^/]+/switch$"
secrets = ["OBELISK__API__TOKEN"]
replace_in = ["headers"]

# --- MCP servers (stateless) --------------------------------------------------
# Each configured MCP server is one activity block plus one outbound-host grant,
# mirroring the single-LLM-endpoint precedent. The function name after
# `obelisk-agent:mcp/server.` is the server name; the workflow discovers matching
# exports and registers each as a shell command (`<server> tools|call|prompts|
# prompt|info`), with a global `mcp` registry command over them. Resources are
# mounted lazily under `/workspace/mcp/<server>`. A single
# activity/mcp.js is reused by every server: each block sets the fixed env var
# MCP_SERVER_URL (the full endpoint the activity POSTs to) and, for an
# authenticated server, exposes the fixed secret MCP_SERVER_TOKEN (a placeholder
# bearer the runtime swaps for the real secret in the outbound header). Every
# activity instance has its own env, so URLs differ per block freely; one
# server.toml can name only one MCP_SERVER_TOKEN, so >1 authenticated server is a
# v1 limitation. Copy the block below, rename the server, point MCP_SERVER_URL at
# it, and add the matching server.toml grant. See docs/mcp.md.
#
# [[activity_js]]
# name = "mcp_obelisk_local"
# ffqn = "obelisk-agent:mcp/server.obelisk-local"
# params = [
#   { name = "method",      type = "string" },
#   { name = "params-json", type = "string" },
# ]
# return_type = "result<string, string>"
# location = "activity/mcp.js"
# env_vars = [{ key = "MCP_SERVER_URL", value = "${MCP_OBELISK_LOCAL_URL:-http://127.0.0.1:1071/mcp}" }]
# [[activity_js.allowed_host]]
# pattern = "${MCP_OBELISK_LOCAL_URL:-http://127.0.0.1:1071}"
# methods = ["POST"]
# secrets = ["MCP_SERVER_TOKEN"]   # optional bearer; omit this and the server.toml secret for a keyless server
# replace_in = ["headers"]
