# --- Pack descriptor: system prompt + tool catalog ----------------------------
# The obelisk-control use case (control this Obelisk instance). Returns the
# system prompt and the tool catalog (name, description, ffqn, WIT param specs).
# The generic session loop calls this once, exposes the tools to
# the model, and dispatches each call to its ffqn via obelisk.call. Swap this
# FFQN (workflow.run-cancellable descriptor-ffqn) to host a different use case.

[[activity_js]]
name = "pack_describe"
ffqn = "obelisk-control:agent/pack.describe"
params = []
return_type = "result<record { prompt: string, tools-json: string }, string>"
location = "packs/obelisk-control/descriptor.js"
[[activity_js.allowed_host]]
pattern = "https://obeli.sk"
methods = ["GET"]
request_url_regex = "^GET https://obeli\\.sk/docs/latest/llms.txt/"

# --- Discoverable shell programs ---------------------------------------------
# Every function in this interface has the same process-like signature. The
# workflow discovers matching exports at session startup and registers each
# function name as a just-bash command.

[[activity_js]]
name = "program_curl"
ffqn = "obelisk-agent:programs/program.curl"
params = [
  { name = "stdin", type = "string" },
  { name = "args",  type = "list<string>" },
]
return_type = "result<record { stdout: string, stderr: string, exit-code: u32 }, string>"
location = "activity/curl.js"
[[activity_js.allowed_host]]
pattern = "https://obeli.sk"
methods = ["GET"]

# Native call: run any deployed Obelisk function chosen at runtime by the model
# (obelisk-control pack). A workflow, so obelisk.call runs durably in-loop.
[[workflow_js]]
ffqn = "obelisk-control:tools/native.call"
params = [
  { name = "ffqn",        type = "string" },
  { name = "params-json", type = "string" },
]
return_type = "result<string, string>"
location = "packs/obelisk-control/native-call.js"

# --- LLM endpoint: multi-provider client --------------------------------------
# The only way the agent talks to a model. It speaks a provider-neutral message
# model and routes each request to the correct wire API (anthropic-messages,
# openai-chat-completions, openai-responses) based on the AGENT_MODELS catalog.
#
# AGENT_MODELS is a JSON array of models: each entry has
#   { id, label, api_type, path?, wire_model, max_tokens? }
# It is REQUIRED (no built-in default): set it in the environment before serving
# (see .envrc-example / models.*.json). The endpoint origin is shared across the
# catalog via LLM_BASE_URL, and a single LLM_API_KEY secret authenticates it; the
# per-model `path` is only the provider prefix appended to that origin.

[[activity_js]]
name = "llm_chat"
ffqn = "obelisk-agent:llm/chat.completion"
params = [
  { name = "system",        type = "string" },
  { name = "messages-json", type = "string" },
  { name = "tools-json",    type = "string" },
  { name = "model",         type = "string" },
  { name = "effort",        type = "string" },
]
return_type = """result<
  variant {
    reply(record { content-json: string, stop-reason: string }),
    rate-limited(record { retry-after-seconds: u32, message: string }) },
  string
>
"""
location = "activity/llm-chat.js"
exec.lock_expiry.minutes = 10
max_retries = 3
env_vars = [
  "AGENT_MODELS",
  { key = "LLM_BASE_URL", value = "${LLM_BASE_URL:-http://127.0.0.1:9190}" },
]

# Single LLM endpoint. The origin comes from LLM_BASE_URL and every model in the
# catalog shares it; the per-model `path` prefix plus the adapter route land under
# /v1/(messages|chat/completions|responses). One LLM_API_KEY bearer token
# authenticates the endpoint (unset for the keyless local backend). Switch
# endpoints by setting AGENT_MODELS + LLM_BASE_URL (+ LLM_API_KEY) together:
#   local     http://127.0.0.1:9190          (keyless, models.local.json)
#   exe.dev   http://localhost:7070          (gateway, models.exe-gateway.json)
#   openrouter https://openrouter.ai/api     (models.openrouter.json)
[[activity_js.allowed_host]]
pattern = "${LLM_BASE_URL:-http://127.0.0.1:9190}"
methods = ["POST"]
request_url_regex = "^POST http[s]?://[^/]+(/[^/]+)*/v1/(messages|chat/completions|responses)$"
secrets = ["LLM_API_KEY"]
replace_in = ["headers"]

